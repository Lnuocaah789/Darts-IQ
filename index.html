<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"/>
  <meta name="theme-color" content="#111317"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Darts IQ"/>
  <link rel="manifest" href="/manifest.json"/>
  <link rel="apple-touch-icon" href="/icon-192.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png"/>
  <title>Darts IQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;overflow:hidden}
    body{background:#111317;font-family:'Hanken Grotesk',sans-serif;-webkit-font-smoothing:antialiased}
    #root{height:100%;display:flex;flex-direction:column}
    #loading{position:fixed;inset:0;background:#111317;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999;transition:opacity 0.4s ease}
    #loading.hidden{opacity:0;pointer-events:none}
    #loading-logo{font-family:'Hanken Grotesk',sans-serif;font-size:42px;font-weight:800;letter-spacing:-0.03em;color:#caf300}
    #loading-sub{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:rgba(255,255,255,0.28)}
    #loading-spinner{width:28px;height:28px;border:2px solid rgba(202,243,0,0.12);border-top-color:#caf300;border-radius:50%;animation:spin 0.9s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="loading">
    <div id="loading-logo">DARTS IQ</div>
    <div id="loading-sub">Track · Improve · Excel</div>
    <div id="loading-spinner"></div>
  </div>
  <div id="root"></div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/app.js"></script>
  <script>
    const checkMounted=setInterval(()=>{
      if(document.getElementById('root').children.length>0){
        clearInterval(checkMounted);
        const l=document.getElementById('loading');
        l.classList.add('hidden');
        setTimeout(()=>l.remove(),400);
      }
    },150);
  </script>
</body>
</html>
